name: dotnet test
description: Run the solution tests, write the GitHub job summary, and upload TRX results.

inputs:
  filter:
    description: VSTest filter. Empty runs the whole solution.
    required: false
    default: ""
  artifact-name:
    description: TRX file prefix and uploaded artifact name.
    required: true
  collect:
    description: Data collector passed to dotnet test --collect.
    required: false
    default: ""
  results-directory:
    description: Directory passed to dotnet test --results-directory.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: 🧪 Test
      shell: bash
      env:
        TEST_FILTER: ${{ inputs.filter }}
        TEST_COLLECT: ${{ inputs.collect }}
        TEST_RESULTS: ${{ inputs.results-directory }}
        TRX_PREFIX: ${{ inputs.artifact-name }}
      run: |
        set -euo pipefail
        args=(
          dotnet test Dilcore.MongoDB.sln
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFilePrefix=${TRX_PREFIX}"
          --logger "GitHubActions;summary-include-passed=false;summary-include-skipped=false"
        )
        if [[ -n "${TEST_FILTER}" ]]; then
          args+=(--filter "${TEST_FILTER}")
        fi
        if [[ -n "${TEST_COLLECT}" ]]; then
          args+=(--collect "${TEST_COLLECT}")
        fi
        if [[ -n "${TEST_RESULTS}" ]]; then
          args+=(--results-directory "${TEST_RESULTS}")
        fi
        "${args[@]}"

    - name: 📤 Upload TRX
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: "**/TestResults/**/*.trx"
        if-no-files-found: error
