name: 📦 Publish NuGet Packages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    name: 🚀 Pack & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write is required to push the release git tag created by this job.
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🔢 Calculate Version
        id: version
        run: |
          # Get the latest tag or default to 1.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          
          # Parse major.minor.patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
          
          # Increment patch version
          PATCH=$((PATCH + 1))
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "📦 New version: ${NEW_VERSION}"

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore Dilcore.MongoDB.sln

      - name: 🔨 Build
        run: dotnet build Dilcore.MongoDB.sln --no-restore --configuration Release

      - name: 📦 Pack core packages
        run: |
          dotnet pack src/Dilcore.MongoDB.Abstractions/Dilcore.MongoDB.Abstractions.csproj \
            --no-build --configuration Release --output ./nupkgs \
            -p:Version=${{ steps.version.outputs.version }}
          dotnet pack src/Dilcore.MongoDB/Dilcore.MongoDB.csproj \
            --no-build --configuration Release --output ./nupkgs \
            -p:Version=${{ steps.version.outputs.version }}

      - name: 🚀 Push to GitHub Packages
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/Dilcore-Official/index.json" --skip-duplicate

      - name: 🏷️ Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
