name: 📦 Publish NuGet Packages

# Release pipeline for all libraries. Every run computes the next version from the git tags, tests the commit,
# and publishes to NuGet.org with OIDC trusted publishing. The version is never edited by hand.
#
# Automatic: a merge into main that changes library code (see the paths below) publishes a preview.
# Manual (workflow_dispatch): choose preview or stable, or tick dry_run to test the NuGet.org connection.
#
#   preview = true  (default)  2.0.0-preview.N   N is the highest existing v2.0.0-preview.* tag plus one
#   preview = false            2.X.Y             the patch after the highest stable v2.* tag, or 2.0.0 if none
#
# All libraries are packed in the same run with the same version, so they are always released together.
# On main a publishing run reserves vX.Y.Z-reserved on this commit, pushes the packages, and only after that
# succeeded creates the final vX.Y.Z tag and the GitHub Release. A retry continues only when that reservation
# already points at this commit. dry_run = true tests the whole path (tests, pack, environment approval, OIDC login)
# and stops before the reservation, the push, the tag and the release; it works from any branch. From another
# branch without dry_run the workflow only packs and uploads an artifact.
# One-time setup (nuget.org policy, GitHub environment, NUGET_USER secret): CONTRIBUTING.md, "Releasing".

on:
  push:
    branches: [main]
    # Only files that change what the libraries do or contain. Docs, tests, samples and workflows do not publish.
    paths:
      - 'src/**'
      - '!src/**/*.md'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - 'assets/icon.png'
  workflow_dispatch:
    inputs:
      preview:
        description: Publish a preview (2.0.0-preview.N). Untick for a stable 2.X.Y release.
        type: boolean
        default: true
      dry_run:
        description: Dry run. Test the NuGet.org connection (OIDC login) but do not push, tag or release.
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  # Major version of every package. Change it only for a new major line.
  MAJOR_VERSION: "2"

# One release at a time, so two runs never compute the same version.
concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  verify:
    name: ✅ Version, verify and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🔢 Compute next version
        id: version
        env:
          # A push to main always publishes a preview. Manual runs follow the input.
          PREVIEW: ${{ github.event_name == 'push' || inputs.preview }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          preview_final_re="^v${MAJOR_VERSION}\\.0\\.0-preview\\.[0-9]+$"
          preview_reserved_re="^v${MAJOR_VERSION}\\.0\\.0-preview\\.[0-9]+-reserved$"
          stable_final_re="^v${MAJOR_VERSION}\\.[0-9]+\\.[0-9]+$"
          stable_reserved_re="^v${MAJOR_VERSION}\\.[0-9]+\\.[0-9]+-reserved$"
          if [[ "${PREVIEW}" == "true" ]]; then
            reserved_re="${preview_reserved_re}"
          else
            reserved_re="${stable_reserved_re}"
          fi

          # A re-run of the same commit keeps the version it already reserved.
          reuse=""
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            if [[ "$(git rev-parse "${tag}^{commit}")" != "${GITHUB_SHA}" ]]; then
              continue
            fi
            candidate="${tag#v}"
            candidate="${candidate%-reserved}"
            if git rev-parse --verify --quiet "refs/tags/v${candidate}" > /dev/null \
              && [[ "$(git rev-parse "v${candidate}^{commit}")" != "${GITHUB_SHA}" ]]; then
              echo "::error::Tag v${candidate} already exists on another commit."
              exit 1
            fi
            if [[ -n "${reuse}" && "${reuse}" != "${candidate}" ]]; then
              echo "::error::Commit ${GITHUB_SHA} reserves both ${reuse} and ${candidate}."
              exit 1
            fi
            reuse="${candidate}"
          done < <(git tag --list | grep -E "${reserved_re}" || true)

          if [[ -n "${reuse}" ]]; then
            version="${reuse}"
          elif [[ "${PREVIEW}" == "true" ]]; then
            last="$(
              {
                git tag --list | grep -E "${preview_final_re}" | sed -E 's/^.*-preview\.//' || true
                git tag --list | grep -E "${preview_reserved_re}" | sed -E 's/^.*-preview\.([0-9]+)-reserved$/\1/' || true
              } | grep -E '^[0-9]+$' | sort -n | tail -1 || true
            )"
            version="${MAJOR_VERSION}.0.0-preview.$(( ${last:-0} + 1 ))"
          else
            last="$(
              {
                git tag --list | grep -E "${stable_final_re}" | sed 's/^v//' || true
                git tag --list | grep -E "${stable_reserved_re}" | sed -E 's/^v//; s/-reserved$//' || true
              } | grep -E '^[0-9]+' | sort -V | tail -1 || true
            )"
            if [[ -z "${last}" ]]; then
              version="${MAJOR_VERSION}.0.0"
            else
              IFS='.' read -r major minor patch <<< "${last}"
              version="${major}.${minor}.$(( patch + 1 ))"
            fi
          fi
          if [[ -z "${reuse}" ]] && git rev-parse --verify --quiet "refs/tags/v${version}" > /dev/null; then
            echo "::error::Tag v${version} already exists."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "📦 Next version: ${version}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: 🐳 Docker preflight
        run: |
          docker version
          docker info

      - name: 📦 Restore dependencies
        run: dotnet restore Dilcore.MongoDB.sln --locked-mode

      - name: 🎨 Verify formatting
        run: dotnet format Dilcore.MongoDB.sln --verify-no-changes --no-restore

      - name: 🔨 Build
        run: dotnet build Dilcore.MongoDB.sln --no-restore --configuration Release -warnaserror -p:ContinuousIntegrationBuild=true

      - name: 🧪 Test (unit, architecture, package, consumer smoke, integration)
        uses: ./.github/actions/dotnet-test
        with:
          artifact-name: release-trx

  pack-only:
    name: 🧪 Pack only (not on main)
    if: github.ref != 'refs/heads/main' && !inputs.dry_run
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 📦 Pack
        uses: ./.github/actions/pack-nuget
        with:
          version: ${{ needs.verify.outputs.version }}

      - name: 📤 Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

  release:
    name: 🚀 Publish to NuGet.org
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment name must match the trusted publishing policy on nuget.org.
    environment: nuget
    permissions:
      contents: write   # version tag and GitHub Release
      id-token: write   # OIDC token for NuGet/login

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 📦 Pack
        uses: ./.github/actions/pack-nuget
        with:
          version: ${{ needs.verify.outputs.version }}

      # Reserve the version on this commit before anything is pushed. A later run may continue only when
      # vX.Y.Z-reserved already points at GITHUB_SHA. The final vX.Y.Z tag is created after the push.
      - name: 🔒 Reserve version
        id: reserve
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          final_sha="$(git ls-remote origin "refs/tags/v${VERSION}" | awk 'NR==1 { print $1 }')"
          if [[ -n "${final_sha}" && "${final_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag v${VERSION} already points at ${final_sha}, not ${GITHUB_SHA}."
            exit 1
          fi
          if [[ "${final_sha}" == "${GITHUB_SHA}" ]]; then
            echo "already_released=true" >> "${GITHUB_OUTPUT}"
            echo "v${VERSION} is already published from this commit." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          reserved_sha="$(git ls-remote origin "refs/tags/v${VERSION}-reserved" | awk 'NR==1 { print $1 }')"
          if [[ -z "${reserved_sha}" ]]; then
            git tag "v${VERSION}-reserved" "${GITHUB_SHA}"
            git push origin "refs/tags/v${VERSION}-reserved"
          elif [[ "${reserved_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Version ${VERSION} is reserved by ${reserved_sha}, not ${GITHUB_SHA}."
            exit 1
          fi
          echo "already_released=false" >> "${GITHUB_OUTPUT}"

      # Request the short-lived key right before the push. It is valid for about an hour.
      - name: 🔑 NuGet login (OIDC)
        id: login
        if: ${{ inputs.dry_run || steps.reserve.outputs.already_released != 'true' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: ✅ Dry run result
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          KEY_ISSUED: ${{ steps.login.outputs.NUGET_API_KEY != '' }}
        run: |
          echo "### 🧪 Dry run ${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
          echo "OIDC login to NuGet.org succeeded (key issued: ${KEY_ISSUED}). Nothing was pushed, tagged or released." >> "${GITHUB_STEP_SUMMARY}"

      - name: 📤 Upload packages (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

      # Pushing the .nupkg files also pushes the matching .snupkg symbol packages from the same folder.
      - name: 🚀 Push to NuGet.org
        if: ${{ !inputs.dry_run && steps.reserve.outputs.already_released != 'true' }}
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${NUGET_API_KEY}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # The final tag is created only after the push succeeded. A retry is a no-op when the tag already
      # points at this commit, and it fails when another commit owns the tag. The reservation is removed
      # once the final tag exists.
      - name: 🏷️ Tag the published commit
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          final_sha="$(git ls-remote origin "refs/tags/v${VERSION}" | awk 'NR==1 { print $1 }')"
          if [[ -n "${final_sha}" && "${final_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag v${VERSION} already points at ${final_sha}, not ${GITHUB_SHA}."
            exit 1
          fi
          if [[ "${final_sha}" != "${GITHUB_SHA}" ]]; then
            git tag "v${VERSION}" "${GITHUB_SHA}"
            git push origin "refs/tags/v${VERSION}"
          fi
          git push origin ":refs/tags/v${VERSION}-reserved" || true

      - name: 🏷️ Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists."
            exit 0
          fi
          flags=(--generate-notes --verify-tag --title "v${VERSION}")
          if [[ "${VERSION}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v${VERSION}" artifacts/* "${flags[@]}"
