name: 🔄 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    name: 📐 Architecture Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: 📦 Restore dependencies
        run: dotnet restore Dilcore.MongoDB.sln --locked-mode

      - name: 🎨 Verify formatting
        run: dotnet format Dilcore.MongoDB.sln --verify-no-changes --no-restore

      - name: 🔨 Build
        run: dotnet build Dilcore.MongoDB.sln --no-restore --configuration Release -warnaserror -p:ContinuousIntegrationBuild=true

      - name: 🧪 Architecture + unit tests
        uses: ./.github/actions/dotnet-test
        with:
          filter: FullyQualifiedName~ArchitectureTests|FullyQualifiedName~UnitTests|FullyQualifiedName~PackageTests|FullyQualifiedName~ConsumerTests
          artifact-name: architecture-trx

  di-acceptance:
    name: 🧩 DI Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: 🐳 Docker preflight
        run: |
          docker version
          docker info

      - name: 📦 Restore dependencies
        run: dotnet restore Dilcore.MongoDB.sln --locked-mode

      - name: 🔨 Build
        run: dotnet build Dilcore.MongoDB.sln --no-restore --configuration Release -warnaserror -p:ContinuousIntegrationBuild=true

      - name: 🧪 DI acceptance + integration tests
        uses: ./.github/actions/dotnet-test
        with:
          filter: FullyQualifiedName~IntegrationTests
          artifact-name: di-acceptance-trx

  integration-matrix:
    name: 🧪 Integration Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: 🐳 Docker preflight
        run: |
          docker version
          docker info

      - name: 📦 Restore dependencies
        run: dotnet restore Dilcore.MongoDB.sln --locked-mode

      - name: 🔨 Build
        run: dotnet build Dilcore.MongoDB.sln --no-restore --configuration Release -warnaserror -p:ContinuousIntegrationBuild=true

      - name: 🧪 Replica-set / production matrix
        uses: ./.github/actions/dotnet-test
        with:
          filter: TestCategory=M3Matrix
          artifact-name: integration-matrix-trx

  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [architecture]
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: 🐳 Docker preflight
        run: |
          docker version
          docker info

      - name: 📦 Restore dependencies
        run: dotnet restore Dilcore.MongoDB.sln --locked-mode

      - name: 🔨 Build
        run: dotnet build Dilcore.MongoDB.sln --no-restore --configuration Release -warnaserror -p:ContinuousIntegrationBuild=true

      - name: 🧪 Test
        uses: ./.github/actions/dotnet-test
        with:
          artifact-name: full-trx
          collect: XPlat Code Coverage;Format=cobertura
          results-directory: ${{ github.workspace }}/TestResults

      - name: 📊 Merge coverage reports
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@861674232075b2c6bd1405a04c4bb9b150653e81 # v5.5.12
        with:
          reports: "TestResults/**/coverage.cobertura.xml"
          targetdir: "TestResults/coverage-merged"
          reporttypes: "Cobertura;MarkdownSummaryGithub"

      - name: 📈 Coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: "TestResults/coverage-merged/Cobertura.xml"
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: "60 80"

      - name: 💬 Post coverage comment to PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: always() && github.event_name == 'pull_request'
        with:
          header: dotnet-coverage
          path: code-coverage-results.md

      - name: ☂️ Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        if: always()
        with:
          disable_search: true
          fail_ci_if_error: true
          files: TestResults/coverage-merged/Cobertura.xml
          flags: dotnet
          slug: Dilcore-Official/Dilcore-MongoDb
          use_oidc: true
