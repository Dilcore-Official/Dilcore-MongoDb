name: 🔄 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    name: 📐 Architecture Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore Dilcore.MongoDB.sln

      - name: 🔨 Build
        run: dotnet build Dilcore.MongoDB.sln --no-restore --configuration Release

      - name: 🧪 Architecture + unit tests
        run: >
          dotnet test Dilcore.MongoDB.sln
          --no-build
          --configuration Release
          --verbosity normal
          --filter "FullyQualifiedName~ArchitectureTests|FullyQualifiedName~UnitTests"
          --logger "trx;LogFileName=architecture.trx"

      - name: 📤 Upload TRX
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-trx
          path: "**/TestResults/**/*.trx"

  di-acceptance:
    name: 🧩 DI Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 🐳 Docker preflight
        run: |
          docker version
          docker info

      - name: 📦 Restore dependencies
        run: dotnet restore Dilcore.MongoDB.sln

      - name: 🔨 Build
        run: dotnet build Dilcore.MongoDB.sln --no-restore --configuration Release

      - name: 🧪 DI acceptance + integration tests
        run: >
          dotnet test Dilcore.MongoDB.sln
          --no-build
          --configuration Release
          --verbosity normal
          --filter "FullyQualifiedName~IntegrationTests"
          --logger "trx;LogFileName=di-acceptance.trx"

      - name: 📤 Upload TRX
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: di-acceptance-trx
          path: "**/TestResults/**/*.trx"

  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [architecture]
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 🐳 Docker preflight
        run: |
          docker version
          docker info

      - name: 📦 Restore dependencies
        run: dotnet restore Dilcore.MongoDB.sln

      - name: 🔨 Build
        run: dotnet build Dilcore.MongoDB.sln --no-restore --configuration Release

      - name: 🧪 Test
        run: >
          dotnet test Dilcore.MongoDB.sln
          --no-build
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory "${{ github.workspace }}/TestResults"
          --logger "trx;LogFileName=full.trx"

      - name: 📤 Upload TRX
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-trx
          path: "**/TestResults/**/*.trx"

      - name: 📊 Merge coverage reports
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: "TestResults/**/coverage.cobertura.xml"
          targetdir: "TestResults/coverage-merged"
          reporttypes: "Cobertura;MarkdownSummaryGithub"

      - name: 📈 Coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "TestResults/coverage-merged/Cobertura.xml"
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: "60 80"

      - name: 💬 Post coverage comment to PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request'
        with:
          header: dotnet-coverage
          path: code-coverage-results.md

      - name: ☂️ Upload to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: "TestResults/**/coverage.cobertura.xml"
          flags: dotnet
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
