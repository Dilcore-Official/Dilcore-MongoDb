name: 🔄 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    name: 📐 Architecture Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore Dilcore.MongoDB.sln

      - name: 🔨 Build
        run: dotnet build Dilcore.MongoDB.sln --no-restore --configuration Release

      - name: 🧪 Architecture + unit tests
        run: >
          dotnet test Dilcore.MongoDB.sln
          --no-build
          --configuration Release
          --verbosity normal
          --filter "FullyQualifiedName~ArchitectureTests|FullyQualifiedName~UnitTests"
          --logger "trx;LogFileName=architecture.trx"

      - name: 📤 Upload TRX
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecture-trx
          path: "**/TestResults/**/*.trx"

  di-acceptance:
    name: 🧩 DI Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: 🐳 Docker preflight
        run: |
          docker version
          docker info

      - name: 📦 Restore dependencies
        run: dotnet restore Dilcore.MongoDB.sln

      - name: 🔨 Build
        run: dotnet build Dilcore.MongoDB.sln --no-restore --configuration Release

      - name: 🧪 DI acceptance + integration tests
        run: >
          dotnet test Dilcore.MongoDB.sln
          --no-build
          --configuration Release
          --verbosity normal
          --filter "FullyQualifiedName~IntegrationTests"
          --logger "trx;LogFileName=di-acceptance.trx"

      - name: 📤 Upload TRX
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: di-acceptance-trx
          path: "**/TestResults/**/*.trx"

  integration-matrix:
    name: 🧪 Integration Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: 🐳 Docker preflight
        run: |
          docker version
          docker info

      - name: 📦 Restore dependencies
        run: dotnet restore Dilcore.MongoDB.sln

      - name: 🔨 Build
        run: dotnet build Dilcore.MongoDB.sln --no-restore --configuration Release

      - name: 🧪 Replica-set / production matrix
        run: >
          dotnet test Dilcore.MongoDB.sln
          --no-build
          --configuration Release
          --verbosity normal
          --filter "TestCategory=M3Matrix"
          --logger "trx;LogFileName=integration-matrix.trx"

      - name: 📤 Upload TRX
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-matrix-trx
          path: "**/TestResults/**/*.trx"

  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [architecture]
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: 🐳 Docker preflight
        run: |
          docker version
          docker info

      - name: 📦 Restore dependencies
        run: dotnet restore Dilcore.MongoDB.sln

      - name: 🔨 Build
        run: dotnet build Dilcore.MongoDB.sln --no-restore --configuration Release

      - name: 🧪 Test
        run: >
          dotnet test Dilcore.MongoDB.sln
          --no-build
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory "${{ github.workspace }}/TestResults"
          --logger "trx;LogFileName=full.trx"

      - name: 📤 Upload TRX
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-trx
          path: "**/TestResults/**/*.trx"

      - name: 📊 Merge coverage reports
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: "TestResults/**/coverage.cobertura.xml"
          targetdir: "TestResults/coverage-merged"
          reporttypes: "Cobertura;MarkdownSummaryGithub"

      - name: 📈 Coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: "TestResults/coverage-merged/Cobertura.xml"
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: "60 80"

      - name: 💬 Post coverage comment to PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: always() && github.event_name == 'pull_request'
        with:
          header: dotnet-coverage
          path: code-coverage-results.md

      - name: ☂️ Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        if: always()
        with:
          disable_search: true
          fail_ci_if_error: true
          files: TestResults/coverage-merged/Cobertura.xml
          flags: dotnet
          slug: Dilcore-Official/Dilcore-MongoDb
          use_oidc: true
