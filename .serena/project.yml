# the name by which the project can be referenced within Serena
project_name: "Dilcore.MongoDB"

# list of languages for which language servers are started
languages:
  - csharp

# the encoding used by text files in the project
encoding: "utf-8"

# line ending convention: unset uses global setting
line_ending:

# language backend: unset uses global setting (LSP or JetBrains)
language_backend:

# whether to use project's .gitignore files to ignore files
ignore_all_files_in_gitignore: true

# language server-specific options
ls_specific_settings: {}

# additional paths to ignore (gitignore syntax); quote paths that contain special chars
ignored_paths:
  - "**/bin/**"
  - "**/obj/**"
  - "**/TestResults/**"
  - "**/BenchmarkDotNet.Artifacts/**"
  - "**/.vs/**"
  - "**/nupkgs/**"

# whether the project is in read-only mode
read_only: false

# tools to exclude beyond global exclusions
excluded_tools: []

# optional tools to include
included_optional_tools: []

# fixed tool set (leave empty to use Serena defaults)
fixed_tools: []

# base/default modes: unset inherits global configuration
base_modes:
default_modes:

# initial prompt always given on project activation
initial_prompt: |
  Dilcore.MongoDB is an opinionated .NET 10 MongoDB application toolkit (not a driver
  replacement, not Amazon DocumentDB, not provider-neutral). Read AGENTS.md for What/Why,
  ROADMAP.md for milestone scope, CONTRIBUTING.md for How to build/test/PR.
  Use Serena MCP for C# discovery AND edits (replace_symbol_body, insert_*,
  rename_symbol, safe_delete_symbol, replace_content) — not read-only search.
  Use Context7 MCP for MongoDB.Driver and third-party library docs; Microsoft
  Learn MCP for .NET and Microsoft.Extensions APIs. Do not invent
  provider-neutral DocumentDB claims.
  Integration tests require Docker/Testcontainers. Never commit .serena/project.local.yml
  or secrets. Keep documentation and PublicAPI baselines in the same change as code.

# symbol info budget: unset inherits global
symbol_info_budget:

# read-only / ignored memory patterns
read_only_memory_patterns: []
ignored_memory_patterns: []
